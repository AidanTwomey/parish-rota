name: deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: "10.0.x"
  FUNCTIONS_PROJECT: src/ParishRota.Functions/ParishRota.Functions.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Domain logic is developed test-first (CLAUDE.md) — a red suite must
      # never reach Azure.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.FUNCTIONS_PROJECT }} --no-build -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: functions-package
          path: ./publish
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: functions-package
          path: ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Terraform gives the Function App a random suffix for global uniqueness,
      # so hand-copying the name into a variable is easy to get wrong (and easy
      # to forget). Fall back to finding it by the tags Terraform sets.
      - name: Resolve Function App name
        id: app
        run: |
          NAME="${{ vars.AZURE_FUNCTIONAPP_NAME }}"
          if [ -z "$NAME" ]; then
            NAME=$(az functionapp list \
              --query "[?tags.project=='parishrota' && tags.environment=='prod'].name | [0]" \
              -o tsv)
          fi
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "::error::No Function App found. Has the infra workflow applied successfully?"
            exit 1
          fi
          echo "Deploying to $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ./publish
