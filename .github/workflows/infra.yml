name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure

env:
  # Keep in step with the terraform feature version in .devcontainer/devcontainer.json.
  TF_VERSION: "1.15.8"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true" # state access via Entra, not a storage key
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  TF_VAR_whatsapp_phone_number_id: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
  TF_VAR_whatsapp_access_token: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
  TF_VAR_whatsapp_verify_token: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
  TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    # Runs under 'prod' so it can read the prod-scoped variables, and so its
    # OIDC subject is environment:prod — the same federated credential the apply
    # and deploy jobs use. Trade-off: adding a required reviewer to prod would
    # gate pull request plans behind an approval too.
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      # Empty values here surface much later as a confusing Terraform backend
      # error about Azure CLI login, so fail fast and say what's actually wrong.
      - name: Check required configuration
        run: |
          missing=""
          [ -n "$ARM_CLIENT_ID" ]                      || missing="$missing AZURE_CLIENT_ID"
          [ -n "$ARM_TENANT_ID" ]                      || missing="$missing AZURE_TENANT_ID"
          [ -n "$ARM_SUBSCRIPTION_ID" ]                || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "${{ vars.TFSTATE_RESOURCE_GROUP }}" ]  || missing="$missing TFSTATE_RESOURCE_GROUP"
          [ -n "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" ] || missing="$missing TFSTATE_STORAGE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Missing variables:$missing"
            echo "This job runs under the 'prod' environment, so these must be visible to it:"
            echo "  Settings -> Environments -> prod -> Environment variables"
            echo "  (or Settings -> Secrets and variables -> Actions -> Variables, repository scope)"
            exit 1
          fi
          echo "Configuration present."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=parish-rota.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Gate on the 'prod' environment — add required reviewers in repo settings
    # to turn this into a manual approval step.
    environment: prod
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=parish-rota.tfstate" \
            -backend-config="use_azuread_auth=true"

      # Re-planned here rather than passing a plan file between jobs: a saved
      # plan would carry the API keys into a workflow artifact.
      - name: Apply
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      - name: Outputs
        run: terraform output
